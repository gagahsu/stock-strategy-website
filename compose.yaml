services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/strategy.db
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      API_BASE_URL: http://backend:8000
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
